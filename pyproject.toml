[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmstxt-tools"
version = "0.1.0"
description = "Validate and generate llms.txt files for your website"
readme = "README.md"
authors = [{name = "Adventure Agent", email = "agent@astraintelligence.co"}]
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["llmstxt", "llms-txt", "ai", "seo", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/astra-intelligence/llmstxt-tools"
Repository = "https://github.com/astra-intelligence/llmstxt-tools"

[project.scripts]
llmstxt = "llmstxt_tools.cli:main"

[tool.setuptools.packages.find]
include = ["llmstxt_tools*"]
